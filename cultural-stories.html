<style>
body.collection-page{background:#f7f0e4;color:#2b2118}
.collection-header{position:relative;background:#17120d;padding:145px 0 85px}
.collection-header .back-link{display:inline-block;margin-bottom:35px;color:#e9bb67;font-size:10px;letter-spacing:1.8px}
.collection-header h1{font-size:clamp(60px,8vw,105px);line-height:.82;margin:0}
.collection-header p:not(.eyebrow){max-width:700px;line-height:1.8;color:#cfc2b0;margin-top:28px}
.collection-gallery{padding:90px 0 120px}
.collection-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.collection-item{border:0;padding:0;background:#241b13;position:relative;overflow:hidden;cursor:pointer;min-height:560px}
.collection-item img{width:100%;height:100%;min-height:560px;object-fit:cover;display:block;transition:transform .6s ease,filter .6s ease}
.collection-item:hover img{transform:scale(1.035);filter:brightness(.88)}
.collection-item:after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(transparent,#000a);pointer-events:none}
.collection-item span{position:absolute;z-index:2;left:22px;bottom:18px;color:#fff;font-family:"Cormorant Garamond",Georgia,serif;font-size:28px}
.collection-item:focus-visible{outline:2px solid #c8923f;outline-offset:3px}
.image-slot{position:relative;min-height:560px;border:1px dashed #b58b4b;background:#eee4d5;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px}
.image-slot strong{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-size:30px;color:#6d5334}
.image-slot small{display:block;margin-top:10px;color:#7d6a54;line-height:1.6}
.gallery-back{display:flex;justify-content:center;margin-top:55px}
@media(max-width:700px){.collection-header{padding:120px 0 65px}.collection-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.collection-item,.collection-item img,.image-slot{min-height:420px}.collection-gallery{padding:65px 0 90px}}
</style>
</head>

<script>
const toggle=document.querySelector('.menu-toggle'),nav=document.querySelector('.main-nav');
toggle.addEventListener('click',()=>{const open=nav.classList.toggle('open');toggle.setAttribute('aria-expanded',open)});
nav.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>nav.classList.remove('open')));
const items=[...document.querySelectorAll('.collection-item')];
const box=document.createElement('div');box.className='traditional-lightbox';box.innerHTML='<button class="traditional-lightbox-close" aria-label="Close">×</button><button class="traditional-lightbox-prev" aria-label="Previous">‹</button><img alt="Cultural Stories photograph"><button class="traditional-lightbox-next" aria-label="Next">›</button><div class="traditional-lightbox-count"></div>';document.body.appendChild(box);
const img=box.querySelector('img'),count=box.querySelector('.traditional-lightbox-count');let current=0;
function show(i){current=(i+items.length)%items.length;img.src=items[current].dataset.full;count.textContent=(current+1)+' / '+items.length;box.classList.add('open');document.body.style.overflow='hidden'}
function close(){box.classList.remove('open');document.body.style.overflow=''}
items.forEach((item,i)=>item.addEventListener('click',()=>show(i)));
box.querySelector('.traditional-lightbox-close').onclick=close;box.querySelector('.traditional-lightbox-prev').onclick=()=>show(current-1);box.querySelector('.traditional-lightbox-next').onclick=()=>show(current+1);
box.addEventListener('click',e=>{if(e.target===box)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(!box.classList.contains('open'))return;if(e.key==='ArrowLeft')show(current-1);if(e.key==='ArrowRight')show(current+1)});
</script>
